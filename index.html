<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<title>POKÉDEX 3.0</title>
<style>
:root{--bg:#0f1220;--panel:#181c30;--panel2:#212640;--tx:#eef0fa;--mu:#9aa0c0;--ac:#ef4444;--bd:#2b3152;--sh:0 8px 28px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f1f3fa;--panel:#fff;--panel2:#e9ecf7;--tx:#1b1f36;--mu:#5d6384;--bd:#d9ddee;--sh:0 8px 24px rgba(40,50,110,.14)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
body.lock{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--panel2);padding:.55rem .9rem;border-radius:12px;transition:transform .15s,background .2s}

.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;max-width:1300px;margin:auto}
h1{font-size:1.45rem;letter-spacing:.04em;font-weight:900}h1 b{color:var(--ac)}
.acts{display:flex;gap:.4rem;flex-wrap:wrap}.acts select{background:var(--panel2);border:0;border-radius:12px;padding:.5rem}
.prog{max-width:1300px;margin:.55rem auto 0;display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--mu)}

.filters input[type=search]{flex:1 1 220px;min-width:0}
.chip{border:1px solid var(--bd);background:var(--panel);font-size:.85rem;padding:.45rem .8rem;border-radius:99px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.gens{max-width:1300px;margin:.5rem auto 0;display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem}.gens .chip{flex:none}
main{max-width:1300px;margin:auto;padding:1rem}
#count{color:var(--mu);font-size:.9rem;margin-bottom:.7rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.9rem}
.card{position:relative;background:var(--panel);border:1px solid var(--bd);border-radius:20px;padding:.8rem;text-align:center;cursor:pointer;box-shadow:var(--sh);overflow:hidden;animation:pop .35s both;transition:transform .2s}
.card:hover{transform:translateY(-4px) scale(1.02)}
.card:before{content:"";position:absolute;width:140%;aspect-ratio:1;left:-20%;top:-35%;background:var(--c);opacity:.18;border-radius:50%}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.card img{position:relative;width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.no{position:absolute;left:.7rem;top:.6rem;font-weight:800;font-size:.8rem;color:var(--mu)}
.card h3{font-size:1rem;margin:.2rem 0 .4rem;position:relative}
.tys{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap;position:relative}
.ty{color:#fff;font-size:.72rem;font-weight:700;padding:.18rem .6rem;border-radius:99px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.qa{position:absolute;right:.4rem;top:.4rem;display:flex;flex-direction:column;gap:.25rem;z-index:2}
.qa button{padding:.2rem .4rem;border-radius:50%;font-size:.85rem;opacity:.55;background:var(--panel2)}.qa button.on{opacity:1}
.qa .f.on{background:#ec4899}.qa .c.on{background:#22c55e}
.empty{text-align:center;color:var(--mu);padding:3rem 1rem}
#sent{height:2px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.65);backdrop-filter:blur(6px);display:none;overflow-y:auto;padding:1rem}
#modal.on{display:block;animation:fade .25s}@keyframes fade{from{opacity:0}}
.sheet{max-width:860px;margin:0 auto;background:var(--panel);border-radius:26px;overflow:hidden;box-shadow:var(--sh);animation:up .35s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.hero{background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 40%,#000));padding:1rem 1rem 0;color:#fff;text-align:center}
.bar{display:flex;gap:.4rem;justify-content:space-between;flex-wrap:wrap}.bar button{background:rgba(255,255,255,.2);color:#fff}
.hero img{width:min(300px,70vw);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.4));animation:float 3.5s ease-in-out infinite}

.hero h2{font-size:1.9rem}.hero .tys{margin:.5rem 0 1rem}.hero .ty{background:rgba(0,0,0,.28)!important;border:1px solid rgba(255,255,255,.4)}
.body{padding:1.2rem;display:grid;gap:1.3rem}
.body h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:.5rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.facts div{background:var(--panel2);border-radius:14px;padding:.7rem}.facts small{display:block;color:var(--mu);font-size:.75rem}
.st{display:grid;grid-template-columns:110px 36px 1fr;gap:.5rem;align-items:center;font-size:.88rem;margin:.3rem 0}
.st span{color:var(--mu)}.st em{height:9px;background:var(--panel2);border-radius:9px;overflow:hidden}.st em i{display:block;height:100%;border-radius:9px;transition:width .8s}
.gbar{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--panel2)}.gbar i{display:block;height:100%}
.tree,.kid,.kids{display:flex;align-items:center;gap:.6rem}.tree{flex-wrap:wrap}.kids{flex-direction:column;align-items:flex-start}
.req{font-size:.72rem;color:var(--mu);max-width:110px;text-align:center}
.evo{display:flex;flex-direction:column;align-items:center;width:104px;padding:.4rem;border-radius:16px;background:var(--panel2);font-size:.8rem}
.evo img{width:84px;height:84px;object-fit:contain}.evo small{color:var(--mu)}.evo.me{outline:2px solid var(--ac)}
.sk{height:60vh;display:flex;align-items:center;justify-content:center}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:20px;padding:1rem}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;margin-bottom:1rem}.big div{background:var(--panel);border:1px solid var(--bd);border-radius:18px;padding:1rem;font-size:.85rem;color:var(--mu)}.big b{display:block;font-size:1.8rem;color:var(--tx)}
.row{display:grid;grid-template-columns:90px 1fr 40px;gap:.5rem;align-items:center;font-size:.85rem;margin:.35rem 0;cursor:pointer;background:none;width:100%;text-align:left;padding:.1rem}
.row em{height:12px;border-radius:9px;background:var(--panel2);overflow:hidden}.row em i{display:block;height:100%}
@media(max-width:560px){#grid{grid-template-columns:repeat(2,1fr);gap:.6rem}h1{font-size:1.2rem}.st{grid-template-columns:90px 32px 1fr}.hero h2{font-size:1.5rem}#modal{padding:.4rem}.kid{flex-direction:column;align-items:flex-start}}

.sheet[data-tab=info] .pb,.sheet[data-tab=battle] .pi{display:none}

.m0{background:#111827;color:#9ca3af}.m025{background:#14532d;color:#fff}.m05{background:#166534;color:#dcfce7}.m2{background:#9a3412;color:#fff}.m4{background:#991b1b;color:#fff}

async function loadIndex(){
 const c=store.get('pdx_idx_v2',null);if(c&&c.length===1025)return c;
 try{return await loadGql()}catch(e){console.warn('GraphQL failed, using REST',e);return await loadRest()}
}
async function loadGql(){
 const q=o=>`{pokemon_v2_pokemonspecies(order_by:{id:asc},limit:260,offset:${o},where:{id:{_lte:1025}}){id generation_id is_legendary is_mythical gender_rate pokemon_v2_pokemonspeciesnames(where:{pokemon_v2_language:{name:{_in:["en","nl"]}}}){name pokemon_v2_language{name}} pokemon_v2_pokemons(where:{is_default:{_eq:true}},limit:1){pokemon_v2_pokemontypes(order_by:{slot:asc}){pokemon_v2_type{name}}}}}`;
 let done=0;
 const pages=await Promise.all([0,260,520,780].map(async o=>{
  const r=await fetch(GQL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q(o)})});
  if(!r.ok)throw Error('gql');const d=await r.json();done++;$('#lb').style.width=(done*25)+'%';
  return d.data.pokemon_v2_pokemonspecies}));
 const out=pages.flat().map(s=>{const n={};s.pokemon_v2_pokemonspeciesnames.forEach(x=>n[x.pokemon_v2_language.name]=x.name);
  return{id:s.id,g:s.generation_id,l:s.is_legendary,m:s.is_mythical,gr:s.gender_rate,n:{en:n.en||'#'+s.id,nl:n.nl||n.en||'#'+s.id},
   t:(s.pokemon_v2_pokemons[0]?.pokemon_v2_pokemontypes||[]).map(x=>x.pokemon_v2_type.name)}});
 if(out.length!==1025)throw Error('count');
 store.set('pdx_idx_v2',out);return out;
}
async function detail(id){
 if(D[id])return D[id];
 const [p,s]=await Promise.all([j(`${API}/pokemon/${id}`),j(`${API}/pokemon-species/${id}`)]);
 const u=s.evolution_chain.url;const c=CH[u]||(CH[u]=await j(u));
 return D[id]={p,s,c};
}

async function loadRest(){
 $('#lb').style.width='10%';
 const [sp,...rest]=await Promise.all([j(`${API}/pokemon-species?limit=1025`),...T.map(x=>j(`${API}/type/${x}`)),...ROM.map((r,i)=>j(`${API}/generation/${i+1}`))]);
 const ty={},gn={};
 rest.slice(0,18).forEach((d,i)=>d.pokemon.forEach(x=>{const id=pid(x.pokemon.url);if(id<=1025)(ty[id]=ty[id]||[]).push([x.slot,T[i]])}));
 rest.slice(18).forEach((d,i)=>d.pokemon_species.forEach(x=>gn[pid(x.url)]=i+1));
 const out=sp.results.map(r=>{const id=pid(r.url),n=pretty(r.name);return{id,g:gn[id]||1,l:false,m:false,gr:-1,x:0,n:{en:n,nl:n},t:(ty[id]||[]).sort((a,b)=>a[0]-b[0]).map(a=>a[1])}}).sort((a,b)=>a.id-b.id);
 if(out.length!==1025)throw Error('count '+out.length);
 return out;
}
async function enrich(again){
 const todo=ALL.filter(p=>p.x===0);let i=0,done=ALL.length-todo.length;
 const worker=async()=>{while(i<todo.length){const p=todo[i++];
  try{const s=await j(`${API}/pokemon-species/${p.id}`);const n={};s.names.forEach(x=>n[x.language.name]=x.name);
   p.n={en:n.en||p.n.en,nl:n.nl||n.en||p.n.en};p.l=s.is_legendary;p.m=s.is_mythical;p.gr=s.gender_rate;p.x=1;done++}catch(e){}
  if(done%40===0)$('#ptxt').textContent=`${CAU.size}/1025 ${t('prog')} · ⏳ ${done}/1025`}};
 await Promise.all(Array.from({length:20},worker));
 if(!again&&ALL.some(p=>p.x===0))return enrich(true);
 if(ALL.every(p=>p.x===1))store.set('pdx_idx_v2',ALL);
 progress();renderList();
}
/* ---------- boot ---------- */
async function boot(){
 $('#retry').hidden=true;$('#lt').textContent=t('loading');$('#lb').style.width='5%';
 try{
  ALL=await loadIndex();ALL.forEach(p=>BY[p.id]=p);
  $('#lb').style.width='100%';applyLang();renderList();route();
  if(ALL.some(p=>p.x===0))enrich();
  setTimeout(()=>$('#load').classList.add('off'),250);
 }catch(e){
  console.error(e);$('#lt').textContent=(navigator.onLine?t('err')+' ('+(e&&e.message||e)+')':t('off'));
  $('#retry').textContent=t('retry');$('#retry').hidden=false;$('.ball').style.animation='none';
 }
}
$('#retry').onclick=()=>{$('.ball').style.animation='';boot()};

/* ---------- list ---------- */
function filtered(){
 const raw=S.q.trim(),isNum=/^#?\d+$/.test(raw),num=isNum?+raw.replace('#',''):0,q=norm(raw),rg=RG[S.region];
 let r=ALL.filter(p=>{
  if(S.type&&!p.t.includes(S.type))return false;
  if(S.gen&&p.g!==S.gen)return false;
  if(rg&&(p.id<rg.a||p.id>rg.b))return false;
  if(S.leg&&!p.l)return false;if(S.myth&&!p.m)return false;
  if(S.fav&&!FAV.has(p.id))return false;if(S.cau&&!CAU.has(p.id))return false;
  if(raw){if(isNum)return p.id===num||String(p.id).startsWith(String(num));
   return norm(p.n.en).includes(q)||norm(p.n.nl).includes(q)}
  return true});
 if(S.sort==='rev')r.reverse();
 if(S.sort==='az'||S.sort==='za'){r.sort((a,b)=>nm(a).localeCompare(nm(b),S.lang));if(S.sort==='za')r.reverse()}
 return r;
}

 const gc=ROM.map((r,i)=>[i+1,ALL.filter(p=>p.g===i+1).length]),mg=Math.max(...gc.map(a=>a[1]));
 $('#statsView').innerHTML=`<div class="big"><div><b>1025</b>${t('total')}</div><div><b>${CAU.size}</b>${t('cau')}</div><div><b>${FAV.size}</b>${t('fav')}</div><div><b>${ALL.filter(p=>p.l).length}</b>${t('leg')}</div><div><b>${ALL.filter(p=>p.m).length}</b>${t('myth')}</div></div>
 <div class="dash"><div class="panel"><h4>${t('byT')}</h4>${tc.map(([x,n])=>`<button class="row" data-type="${x}"><span>${tn(x)}</span><em><i style="width:${n/mt*100}%;background:${TC[x]}"></i></em><b>${n}</b></button>`).join('')}</div>
 <div class="panel"><h4>${t('byG')}</h4>${gc.map(([g,n])=>`<button class="row" data-gen="${g}" data-show="1"><span>${t('cnt')} ${ROM[g-1]}</span><em><i style="width:${n/mg*100}%;background:var(--ac)"></i></em><b>${n}</b></button>`).join('')}</div>
 <div class="panel"><h4>${t('regions')}</h4>${REG.map(r=>`<button class="row" data-region="${r.k}"><span>${r.n}</span><em><i style="width:${(r.b-r.a+1)/mg*100}%;background:${r.c1}"></i></em><b>${r.b-r.a+1}</b></button>`).join('')}</div></div>`;
}
function setView(v){S.view=v;$('#listView').hidden=v!=='list';$('#regView').hidden=v!=='regions';$('#statsView').hidden=v!=='stats';$('#fbar').hidden=v!=='list';
 if(v==='stats')renderStats();if(v==='regions')renderRegions();applyLang();window.scrollTo(0,0)}
/* ---------- detail ---------- */
const pid=u=>+u.match(/\/(\d+)\/?$/)[1];
function req(d){
 if(!d)return'';const a=[];
 if(d.min_level)a.push(`${t('lvl')} ${d.min_level}`);
 if(d.item)a.push(pretty(d.item.name));
 if(d.held_item)a.push(`${t('hold')} ${pretty(d.held_item.name)}`);
 if(d.min_happiness||d.min_affection)a.push(t('happy'));
 if(d.time_of_day)a.push(t(d.time_of_day==='day'?'day':'night'));
 if(d.known_move)a.push(pretty(d.known_move.name));
 if(d.location)a.push(pretty(d.location.name));
 if(d.trigger.name==='trade')a.push(t('trade'));
 if(!a.length)a.push(d.trigger.name==='level-up'?t('lvlup'):pretty(d.trigger.name));
 return a.join(' · ');
}
function evoNode(n){
 const id=pid(n.species.url),p=BY[id];
 const me=`<button class="evo ${id===cur?'me':''}" data-go="${id}"><img loading="lazy" data-id="${id}" src="${art(id)}" data-sh="${+S.shiny}" alt=""><small>#${pad(id)}</small><b>${p?nm(p):pretty(n.species.name)}</b></button>`;
 if(!n.evolves_to.length)return me;
 return `<div class="kid">${me}<div class="kids">${n.evolves_to.map(c=>`<div class="kid"><div class="req">→<br>${req(c.evolution_details[0])}</div>${evoNode(c)}</div>`).join('')}</div></div>`;
}
const pick=(arr,k)=>{const l=arr.filter(x=>x.language.name===S.lang);return l.length?[l[l.length-1],0]:[[...arr.filter(x=>x.language.name==='en')].pop(),S.lang==='nl']};

/* ---------- battle ---------- */
const XL={4:'×4',2:'×2',.5:'×½',.25:'×¼',0:'×0'};
function radar(v){
 const c=100,R=72,pt=(i,k)=>{const a=-Math.PI/2+i*Math.PI/3;return[(c+R*k*Math.cos(a)).toFixed(1),(c+R*k*Math.sin(a)).toFixed(1)]};
 const ring=k=>v.map((_,i)=>pt(i,k).join(',')).join(' '),L=['HP','ATK','DEF','SpA','SpD','SPE'];
 return`<svg viewBox="0 0 200 200" role="img" aria-label="${t('bstat')}">${[.25,.5,.75,1].map(k=>`<polygon points="${ring(k)}" fill="none" stroke="var(--bd)"/>`).join('')}
 <polygon points="${v.map((x,i)=>pt(i,Math.min(x,200)/200).join(',')).join(' ')}" fill="var(--ac)" fill-opacity=".35" stroke="var(--ac)" stroke-width="2.5"/>
 ${L.map((l,i)=>{const[x,y]=pt(i,1.2);return`<text x="${x}" y="${y}" font-size="11" fill="var(--mu)" text-anchor="middle" dominant-baseline="middle">${l}</text>`}).join('')}</svg>`;
}
function battle(p,pk){
 const ts=p.t,eff=T.map(a=>[a,ts.reduce((m,d)=>m*(M[a][d]??1),1)]);
 const grp=m=>eff.filter(e=>e[1]===m).map(e=>`<span class="ty" style="background:${TC[e[0]]}">${tn(e[0])} <b>${XL[m]}</b></span>`).join('');
 const sec=(k,ms,c)=>{const h=ms.map(grp).join('');return`<div class="eg ${c}"><h5>${t(k)}</h5><div class="tys l">${h||'<span class="none">—</span>'}</div></div>`};
 const off=[...new Set(ts.flatMap(a=>T.filter(d=>M[a][d]===2)))];
 const st={};pk.stats.forEach(x=>st[x.stat.name]=x.base_stat);
 const ks=['hp','attack','defense','special-attack','special-defense','speed'],vs=ks.map(k=>st[k]);
 const lv=(k,b,mx)=>k==='hp'?(b===1?1:mx?2*b+204:2*b+110):mx?Math.floor((2*b+99)*1.1):Math.floor((2*b+5)*.9);
 const bst=vs.reduce((a,b)=>a+b,0),atk=st.attack,spa=st['special-attack'],spe=st.speed;
 const role=atk>=spa+15?'phys':spa>=atk+15?'spec':'mixed',tier=spe>=100?'fast':spe>=60?'avg':'slow';
 return`<div class="tiles"><div><small>${t('total')}</small><b>${bst}</b></div><div><small>${t('offe')} (Atk+SpA)</small><b>${atk+spa}</b></div><div><small>${t('bulk')} (HP+Def+SpD)</small><b>${st.hp+st.defense+st['special-defense']}</b></div><div><small>${t('speed')}</small><b>${spe} · ${t(tier)}</b></div><div><small>${t('role')}</small><b>${t(role)}</b></div></div>
 <div><h4>${t('bstat')} — ${t('lv')}</h4><div class="rad">${radar(vs)}<table class="tb"><tr><th></th><th>${t('base')}</th><th>${t('mn')}</th><th>${t('mx')}</th></tr>${ks.map((k,i)=>`<tr><td>${t(k)}</td><td><b>${vs[i]}</b></td><td>${lv(k,vs[i],0)}</td><td>${lv(k,vs[i],1)}</td></tr>`).join('')}</table></div></div>
 <div class="egs">${sec('weak',[4,2],'w')}${sec('resist',[.5,.25],'r')}${sec('immune',[0],'i')}<div class="eg s"><h5>${t('strong')}</h5><div class="tys l">${off.map(chip).join('')||'<span class="none">—</span>'}</div></div></div>
 <div><h4>${t('dmg')}</h4><div class="eff">${eff.map(([a,m])=>`<div class="cell m${String(m).replace('.','')}" style="--c:${TC[a]}"><i></i>${tn(a).slice(0,5)}<b>${XL[m]||'×1'}</b></div>`).join('')}</div></div>`;
}

/* ---------- random generator ---------- */
let rtok=0,rtm;
function openRand(){$('#rnd').classList.add('on');document.body.classList.add('lock');roll()}
function closeRand(){clearInterval(rtm);rtok++;$('#rnd').classList.remove('on');$('#rnd').innerHTML='';if(!cur)document.body.classList.remove('lock')}
function roll(){
 const f=S.rf?filtered():[],pool=f.length?f:ALL,my=++rtok;clearInterval(rtm);
 const id=pool[Math.floor(Math.random()*pool.length)].id;let n=0;
 rshell(pool[0].id,true);
 rtm=setInterval(()=>{const q=pool[Math.floor(Math.random()*pool.length)],a=$('#rn'),b=$('#rno');if(a){a.textContent=nm(q);b.textContent='#'+pad(q.id)}
  if(++n>=9){clearInterval(rtm);if(my===rtok)rshell(id,false)}},70);
}
function rshell(id,rolling){
 const p=BY[id],r=regionOf(id),my=rtok;
 $('#rnd').innerHTML=`<div class="rcard${rolling?' rolling':''}" style="--c:${TC[p.t[0]]}"><button class="x" data-rclose aria-label="Close">✕</button>
 <div class="rimg">${rolling?'<div class="ball"></div>':`<img data-id="${id}" data-sh="${+S.shiny}" src="${art(id)}" alt="${nm(p)}">`}</div>
 <small id="rno">#${pad(id)}</small><h2 id="rn">${rolling?'…':nm(p)}</h2><div class="tys">${rolling?'':p.t.map(chip).join('')}</div>
 ${rolling?'':`<div class="rf"><div><small>${t('gen')}</small><b>${ROM[p.g-1]}</b></div><div><small>${t('region')}</small><b>${r.n}</b></div><div><small>${t('h')}</small><b id="rh">…</b></div><div><small>${t('w')}</small><b id="rw">…</b></div></div><p class="rdsc" id="rd">${p.l?'★ '+t('leg'):p.m?'✦ '+t('myth'):''}</p>`}
 <div class="ra">${rolling?'':`<button class="pri" data-ropen="${id}">📖 ${t('open')}</button>`}<button data-reroll>🎲 ${t('again')}</button><button data-shiny></button>
 <label><input type="checkbox" id="rf" ${S.rf?'checked':''}> ${t('useF')}</label></div></div>`;
 shLabels();
 if(!rolling)detail(id).then(d=>{if(my!==rtok||!$('#rh'))return;const fl=pick(d.s.flavor_text_entries),ge=pick(d.s.genera);
  $('#rh').textContent=(d.p.height/10).toFixed(1)+' m';$('#rw').textContent=(d.p.weight/10).toFixed(1)+' kg';
  $('#rd').textContent=[ge[0]?ge[0].genus:'',fl[0]?fl[0].flavor_text.replace(/[\f\n\r]+/g,' '):''].filter(Boolean).join(' — ')}).catch(()=>{if($('#rh')){$('#rh').textContent='—';$('#rw').textContent='—'}});
}

/* ---------- detail modal ---------- */
async function showModal(id){
 cur=id;const p=BY[id],m=$('#modal');m.classList.add('on');document.body.classList.add('lock');
 const col=TC[p.t[0]];
 m.innerHTML=`<div class="sheet" style="--c:${col}"><div class="sk"><div class="ball"></div></div></div>`;
 let d;try{d=await detail(id)}catch(e){if(cur===id)m.innerHTML=`<div class="sheet"><div class="empty">${navigator.onLine?t('err'):t('off')}<br><br><button data-nav="back">← ${t('back')}</button></div></div>`;return}
 if(cur!==id)return;
 const {p:pk,s}=d,fl=pick(s.flavor_text_entries),ge=pick(s.genera);
 const txt=fl[0]?fl[0].flavor_text.replace(/[\f\n\r]+/g,' '):'';
 const stats=pk.stats.map(x=>{const k=x.stat.name;return`<div class="st"><span>${t(k)}</span><b>${x.base_stat}</b><em><i style="width:${Math.min(100,x.base_stat/255*100)}%;background:${x.base_stat>=100?'#22c55e':x.base_stat>=60?'#eab308':'#ef4444'}"></i></em></div>`}).join('');
 const tot=pk.stats.reduce((a,x)=>a+x.base_stat,0);
 const fem=p.gr<0?null:p.gr/8*100;
 const gender=fem===null?t('gl'):`<div class="gbar"><i style="width:${100-fem}%;background:#3b82f6"></i><i style="width:${fem}%;background:#ec4899"></i></div>♂ ${100-fem}% · ♀ ${fem}%`;
 const single=!d.c.chain.evolves_to.length;
 const oa=(pk.sprites&&pk.sprites.other&&pk.sprites.other['official-artwork'])||{},hasSh=!!oa.front_shiny;
 m.innerHTML=`<div class="sheet" style="--c:${col}" data-tab="${S.mtab}">
 <div class="hero"><div class="bar"><button data-nav="back">← ${t('back')}</button><span><button data-nav="prev" title="${t('prev')}">‹ ${t('prev')}</button> <button data-nav="next" title="${t('next')}">${t('next')} ›</button> <button data-nav="rand">🎲</button></span></div>
 <small>#${pad(id)} · ${ge[0]?ge[0].genus:''}</small><h2>${nm(p)}</h2><div class="tys">${p.t.map(chip).join('')}</div>
 <div class="hrow"><button data-shiny ${hasSh?'':`disabled title="${t('shNo')}"`}>${hasSh?'':'✨ '+t('shNo')}</button></div>
 <img data-id="${id}" data-sh="${+S.shiny}" src="${art(id)}" alt="${nm(p)}"></div>
 <div class="body"><div class="mtabs"><button data-mtab="info" class="${S.mtab==='info'?'on':''}">ℹ ${t('info')}</button><button data-mtab="battle" class="${S.mtab==='battle'?'on':''}">⚔ ${t('battle')}</button></div>
 <div class="pi">
  <div><button class="chip ${FAV.has(id)?'on':''}" data-act="fav" data-id="${id}">${FAV.has(id)?t('fvd'):'♡ '+t('fv')}</button> <button class="chip ${CAU.has(id)?'on':''}" data-act="cau" data-id="${id}">${CAU.has(id)?t('cdone'):'○ '+t('cav')}</button></div>
  <div><h4>${t('desc')}</h4><p>${txt}</p>${fl[1]?`<small style="color:var(--mu)">${t('fb')}</small>`:''}</div>
  <div class="facts"><div><small>${t('h')}</small><b>${(pk.height/10).toFixed(1)} m</b></div><div><small>${t('w')}</small><b>${(pk.weight/10).toFixed(1)} kg</b></div><div><small>${t('gen')}</small><b>${ROM[p.g-1]}</b></div><div><small>${t('region')}</small><b>${regionOf(id).n}</b></div>
   <div><small>✨ ${t('shiny')}</small><b>${hasSh?'✓ '+t('shAv'):'✗ '+t('shNo')}</b></div>
   <div><small>${t('ab')}</small>${pk.abilities.map(a=>`<b>${pretty(a.ability.name)}</b>${a.is_hidden?` <small>(${t('hid')})</small>`:''}`).join('<br>')}</div>
   <div><small>${t('gender')}</small>${gender}</div>${p.l?`<div><b>★ ${t('leg')}</b></div>`:''}${p.m?`<div><b>✦ ${t('myth')}</b></div>`:''}</div>
  <div><h4>${t('bs')} — ${t('total')} ${tot}</h4>${stats}</div>
  <div><h4>${t('evo')}</h4>${single?`<p style="color:var(--mu)">${t('noevo')}</p>`:''}<div class="tree">${evoNode(d.c.chain)}</div></div>
 </div>
 <div class="pb">${battle(p,pk)}</div>
 </div></div>`;
 shLabels();m.scrollTop=0;
}
function hideModal(){cur=0;$('#modal').classList.remove('on');if(!$('#rnd').classList.contains('on'))document.body.classList.remove('lock');$('#modal').innerHTML=''}
function route(){const m=location.hash.match(/^#\/(\d+)$/);if(m&&+m[1]>=1&&+m[1]<=1025)showModal(+m[1]);else hideModal()}
const go=id=>{navN++;location.hash='#/'+id};
window.addEventListener('hashchange',route);

/* ---------- events ---------- */
function toggle(set,key,id){set.has(id)?set.delete(id):set.add(id);store.set(key,[...set]);progress();
 document.querySelectorAll(`.card[data-go="${id}"] .${key==='pdx_fav'?'f':'c'}`).forEach(b=>b.classList.toggle('on',set.has(id)));
 if(cur===id)showModal(id);if(S.view==='stats')renderStats();if(S.view==='regions')renderRegions();banner();if((S.fav&&key==='pdx_fav')||(S.cau&&key==='pdx_caught'))renderList()}
const rnd1=()=>1+Math.floor(Math.random()*1025);
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');
 if(a){e.stopPropagation();const id=+a.dataset.id;a.dataset.act==='fav'?toggle(FAV,'pdx_fav',id):toggle(CAU,'pdx_caught',id);return}
 if(e.target.closest('[data-rclose]')||e.target.id==='rnd'){closeRand();return}
 if(e.target.closest('[data-reroll]')){roll();return}
 const ro=e.target.closest('[data-ropen]');if(ro){const id=+ro.dataset.ropen;closeRand();go(id);return}
 const sh=e.target.closest('[data-shiny]');if(sh){if(!sh.disabled){S.shiny=!S.shiny;applyShiny()}return}
 const mt=e.target.closest('[data-mtab]');if(mt){S.mtab=mt.dataset.mtab;const sc=mt.closest('.sheet');sc.dataset.tab=S.mtab;sc.querySelectorAll('[data-mtab]').forEach(b=>b.classList.toggle('on',b===mt));return}
 const v=e.target.closest('[data-view]');if(v){setView(v.dataset.view);return}
 if(e.target.closest('[data-clr]')){S.region='';applyLang();renderList();return}
 const rg=e.target.closest('[data-region]');if(rg){S.region=rg.dataset.region;S.gen=0;setView('list');renderList();return}
 const n=e.target.closest('[data-nav]');
 if(n){const k=n.dataset.nav;if(k==='back'){if(navN>0){navN--;history.back()}else location.hash=''}
  else if(k==='prev')go(cur===1?1025:cur-1);else if(k==='next')go(cur===1025?1:cur+1);else go(rnd1());return}
 const g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
 const r=e.target.closest('.row');
 if(r){if(r.dataset.type){S.type=r.dataset.type}else{S.gen=+r.dataset.gen}setView('list');renderList();return}
 const c=e.target.closest('[data-gen]');if(c){S.gen=+c.dataset.gen;applyLang();renderList();return}
 if(e.target.id==='modal'){if(navN>0){navN--;history.back()}else location.hash=''}
});
document.addEventListener('change',e=>{if(e.target.id==='rf')S.rf=e.target.checked});
document.addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT')return;
 if($('#rnd').classList.contains('on')){if(e.key==='Escape')closeRand();return}
 if(!cur)return;if(e.key==='Escape')location.hash='';if(e.key==='ArrowRight')go(cur===1025?1:cur+1);if(e.key==='ArrowLeft')go(cur===1?1025:cur-1)});
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.q=e.target.value;renderList()},150)};
$('#type').onchange=e=>{S.type=e.target.value;applyLang();renderList()};
$('#region').onchange=e=>{S.region=e.target.value;applyLang();renderList()};
$('#sort').onchange=e=>{S.sort=e.target.value;renderList()};
$('#fToggle').onclick=()=>$('#fx').classList.toggle('open');
[['fLeg','leg'],['fMyth','myth'],['fFav','fav'],['fCau','cau']].forEach(([id,k])=>$('#'+id).onclick=()=>{S[k]=!S[k];applyLang();renderList()});
$('#fReset').onclick=()=>{Object.assign(S,{q:'',type:'',gen:0,region:'',leg:false,myth:false,fav:false,cau:false,sort:'num'});$('#q').value='';applyLang();renderList()};
$('#bRand').onclick=openRand;
$('#bTheme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';store.set('pdx_theme',S.theme);applyLang()};
$('#lang').onchange=e=>{S.lang=e.target.value;store.set('pdx_lang',S.lang);applyLang();renderList();if(S.view==='stats')renderStats();if(S.view==='regions')renderRegions();if(cur)showModal(cur);if($('#rnd').classList.contains('on'))rshell(+($('#rnd img')?$('#rnd img').dataset.id:0)||rnd1(),false)};
window.addEventListener('offline',()=>{});
document.body.classList.toggle('shiny',S.shiny);
applyLang();boot();
</script>
</body>
</html>
